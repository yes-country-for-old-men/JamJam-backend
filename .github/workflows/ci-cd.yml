name: CI / CD

on:
  push:
    branches: [ develop ]

permissions:
  contents: read
  id-token: write               # if needed for OIDC; safe default

jobs:
  # ① Build & Push
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (멀티 아키 빌드용)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/jamjam-backend
          tags: |
            type=raw,value=latest                # 항상 latest
            type=sha                             # 8자리 커밋 SHA (보관용)

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

  # ② Deploy
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging      # GitHub UI “환경” 사용 시
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd /home/ubuntu/jamjam
            echo "▶ pulling latest image"
            sudo docker compose pull        # :latest 이미지 갱신
            echo "▶ restarting containers"
            sudo docker compose up -d --remove-orphans
            echo "▶ cleanup old images"
            sudo docker image prune -f
