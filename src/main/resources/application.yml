spring:
  cool-sms:
    api-key: ${COOL_SMS_API_KEY}
    api-secret: ${COOL_SMS_API_SECRET}
    caller-number: ${COOL_SMS_CALLER_NUMBER}

  cors:
    allowed_origins: ${ALLOWED_ORIGINS}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jwt:
    secret: ${JWT_SECRET}
    
  logging:
    level:
      root: INFO
      com.jamjam: INFO

  openai:
    secret-key: ${OPENAI_SECRET}
  cloud:
    aws:
      region:
        static: ap-northeast-2

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    time-zone: Asia/Seoul

jamjam:
  websocket:
    endpoint: /ws-chat
      
aws:
  s3:
    bucket: jamjam2025

logging:
  level:
    root: DEBUG
    org.springframework.messaging.simp: WARN
    org.springframework.web.socket: WARN
    com.jamjam: DEBUG
    com.jamjam.chat.interceptor: INFO
    org.springframework.messaging: WARN

port-one:
  api:
    base-url: https://api.portone.io/payments/
    secret-key: ${PORTONE_SECRET_KEY}

firebase:
  project-id: jamjam-bc91b
  key-path: ${FIREBASE_KEY}

server:
  forward-headers-strategy: native